name: Validate LEXMARCORP IQ

on:
  pull_request:
    branches: [main]
  push:
    branches: [security/harden-login-registration]
  workflow_dispatch:

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: TypeScript check (current configured scope)
        run: npm run lint
      - name: Build frontend
        run: npm run build
